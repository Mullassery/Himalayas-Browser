[package]
name = "himalayas"
version = "0.1.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
description = "The world's first truly agent-native browser platform"
repository = "https://github.com/Mullassery/Himalayas"
license = "Proprietary"
readme = "README.md"
keywords = ["browser", "agent", "os", "native", "ai"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "himalayas"
path = "src/main.rs"

[lib]
name = "himalayas"
path = "src/lib.rs"

[build-dependencies]
built = "0.7"
chrono = "0.4"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
parking_lot = "0.12"
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
config = { version = "0.13", features = ["toml", "json", "yaml"] }
hyper = { version = "0.14", features = ["full"] }
url = "2.5"
regex = "1.10"
pdf = "0.10"
image = "0.24"
base64 = "0.21"
sys-info = "0.9"
num_cpus = "1.16"
fxhash = "0.2"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winbase", "processthreadsapi", "winnt"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc = "0.2"
objc-foundation = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"

[features]
default = ["india_stack"]
india_stack = []
full = ["india_stack"]

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true
